runtimeBoundary:
  maxRequestSize: 1MB
  allowedOrigins: ["same-origin", "configured-origins"]
  timeoutSeconds: 30

prohibitedBehavior:
  - inlineCredentials
  - evalInProduction
  - dynamicRequire

environmentPolicy:
  nodeVersion: ">=24"
  noUncommittedChangesForRelease: true