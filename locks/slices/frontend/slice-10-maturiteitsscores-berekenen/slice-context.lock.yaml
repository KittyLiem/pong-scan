    transitionIds:
    - resultaatinzichten_en_doelcontext.doelprioriteiten_opgeslagen__doelcontext_zichtbaar
  transitions:
  - from: afgerond
    id: maturiteitsscores_berekenen.afgerond__resultaten_beschikbaar
    kind: recompute
    operationId: getResults
    to: resultaten beschikbaar
  - from: doelprioriteiten opgeslagen
    id: organisatiedoelen_en_prioriteiten.doelprioriteiten_opgeslagen__doelcontext_beschikbaar_in_resultaten
    kind: recompute
    operationId: getResults
    to: doelcontext beschikbaar in resultaten
  - from: resultaten beschikbaar
    id: resultaatinzichten_en_doelcontext.resultaten_beschikbaar__ontwikkelpunten_inzichtelijk
    kind: recompute
    operationId: getResults
    to: ontwikkelpunten inzichtelijk
  - from: doelprioriteiten opgeslagen
    id: resultaatinzichten_en_doelcontext.doelprioriteiten_opgeslagen__doelcontext_zichtbaar
    kind: recompute
    operationId: getResults
    to: doelcontext zichtbaar
  - from: bestaande doelprioriteiten
    id: afgeronde_beoordeling_verfijnen.bestaande_doelprioriteiten__behouden_gekopieerd_of_opnieuw_te_beoordelen
    kind: recompute
    operationId: getResults
    to: behouden, gekopieerd of opnieuw te beoordelen
  unspecified:
  - id: dec-016
    text: Besluit vereist of organisatiedoelen optioneel of verplicht zijn; aanbevolen
      is optionele context.
  - id: asm-012
    text: Doelselectie en prioritering zijn stappen binnen Maturity beoordeling omdat
      geen afzonderlijke pagina bestaat.
  - id: dec-003
    text: Besluit vereist over samenvoeging van vraag- en domeinscores; aanbevolen
      zijn vooraf vastgelegde gewichten per vraag en domein.
  - id: dec-012
    text: Besluit vereist over classificatie van sterktes, gaps en ontwikkelpunten;
      aanbevolen zijn domeinspecifieke grenzen en teksten.
  - id: asm-010
    text: Aanbevelingen gelden als concrete ontwikkelpunten; een zelfstandige roadmapgenerator
      is niet toegevoegd.
  - id: dec-005
    text: Besluit vereist over wijzigingen aan afgeronde scans; aanbevolen is een
      nieuwe revisie binnen dezelfde scan met behoud van eerdere resultaten.
