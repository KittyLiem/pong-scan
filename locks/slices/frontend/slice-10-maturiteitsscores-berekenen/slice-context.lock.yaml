contractSubset:
  apiBasePath: ''
  contractScopeRef:
    capabilityKey: maturiteitsscores_berekenen
    operationIds:
    - getResults
  interfaceSurface:
    operationCount: 19
    pathCount: 16
    versionPrefix: /v1
  operationIds:
  - getResults
  operations:
  - apiBasePath: ''
    fullPath: /v1/scans/{scanId}/results
    method: GET
    operationId: getResults
    parameters:
    - in: path
      name: scanId
      required: true
      schema:
        format: uuid
        type: string
      x-ref: '#/components/parameters/ScanId'
    path: /v1/scans/{scanId}/results
    responses:
      '200':
        content:
          application/json:
            schema:
              properties:
                actionOverview:
                  properties:
                    items:
                      items:
                        $ref: '#/components/schemas/DevelopmentPriorityInput'
                      type: array
                  required:
                  - items
                  type: object
                  x-ref: '#/components/schemas/ActionOverview'
                developmentPoints:
                  items:
                    properties:
                      classification:
                        enum:
                        - strength
                        - gap
                        - development-point
                        type: string
                      domainId:
                        format: uuid
                        type: string
                      id:
                        format: uuid
                        type: string
                      text:
                        type: string
                    required:
                    - id
                    - domainId
                    - classification
                    - text
                    type: object
                    x-ref: '#/components/schemas/DevelopmentPoint'
                  type: array
                domainScores:
                  items:
                    properties:
                      domainId:
                        format: uuid
                        type: string
                      score:
                        maximum: 5
                        minimum: 0
                        type: number
                    required:
                    - domainId
                    - score
                    type: object
                    x-ref: '#/components/schemas/DomainScore'
                  type: array
                goals:
                  items:
                    properties:
                      customText:
                        type: string
                      name:
                        type: string
                      priority:
                        enum:
                        - high
                        - medium
                        - low
                        type: string
                    required:
                    - name
                    - priority
                    type: object
                    x-ref: '#/components/schemas/OrganizationGoal'
                  type: array
                scanId:
                  format: uuid
                  type: string
                totalScore:
                  maximum: 5
                  minimum: 0
                  type: number
              required:
              - scanId
              - totalScore
              - domainScores
              - developmentPoints
              - goals
              type: object
              x-ref: '#/components/schemas/ScanResults'
        description: Reproducible scores, insights, goals, and action overview
      default:
        content:
          application/problem+json:
            schema:
              properties:
                detail:
                  type: string
                instance:
                  format: uri-reference
                  type: string
                status:
                  type: integer
                title:
                  type: string
                type:
                  format: uri-reference
                  type: string
              required:
              - type
              - title
              - status
              type: object
              x-ref: '#/components/schemas/Problem'
        description: Problem details error
        x-ref: '#/components/responses/Problem'
