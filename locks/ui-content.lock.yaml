      method: GET
      operationId: exportScanPdf
      path: /v1/scans/{scanId}/export
    id: export_results
    label: Resultaten exporteren
  - apiRef:
      method: GET
      operationId: getResults
      path: /v1/scans/{scanId}/results
    id: load_results
    label: Resultaten laden
  - apiRef:
      method: PUT
      operationId: saveDevelopmentPriorities
      path: /v1/scans/{scanId}/development-priorities
    id: save_development_priorities
    label: Ontwikkelprioriteiten opslaan
