    path: /v1/scans/{scanId}/export
  - method: GET
    operationId: getResults
    path: /v1/scans/{scanId}/results
  - method: PUT
    operationId: saveDevelopmentPriorities
    path: /v1/scans/{scanId}/development-priorities
  contentKeys:
  - scan_results
  - score_summary
  - domain_scores
  - result_insights
  - strengths
  - development_gaps
  - development_priorities
  - action_overview
  - result_export
  - refine_assessment
  forms:
  - contentKey: development_priorities
    fields:
    - developmentPointId
    - impact
    - urgency
    - selected
    id: development_priorities_form
  goals:
  - Totale maturiteitsscore en domeinscores bekijken
  - Sterktes, gaps en concrete ontwikkelpunten begrijpen
  - Prioriteiten selecteren op impact en urgentie
  - Resultaten en actieoverzicht delen of exporteren
  - Terugkeren naar de beoordeling om antwoorden te verfijnen
  lists:
  - contentKey: domain_scores
    id: domain_score_list
    itemType: domain_score
  - contentKey: result_insights
    id: insight_list
    itemType: development_point
  - contentKey: action_overview
    id: action_overview_list
    itemType: selected_development_priority
  pageKey: Scanresultaten en ontwikkelprioriteiten
  pageTitle: Scanresultaten en ontwikkelprioriteiten
  primaryActions:
