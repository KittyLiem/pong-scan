pages:
- description: Toegangspunt voor gebruikers om in te loggen en hun eerste organisatiecontext
    te starten.
  goals:
  - Inloggen of een account aanmaken
  - Organisatienaam en basiscontext vastleggen
  - Een eerste maturity scan starten
  - Gebruiker naar het scanoverzicht leiden
  key: Aanmelden en organisatie starten
- description: Centrale pagina voor het aanmaken, hervatten, bekijken en beheren van
    maturity scans binnen de organisatie.
  goals:
  - Alle scans met status, voortgang en laatste wijziging bekijken
  - Een nieuwe scan aanmaken met naam en beoordelingsperiode
  - Een conceptscan hervatten
  - Een afgeronde scan openen en beheren
  key: Scanoverzicht
- description: Gestructureerde invulflow waarin de gebruiker per datavolwassenheidsdomein
    vragen beantwoordt en onderbouwing vastlegt.
  goals:
  - Vragen beantwoorden voor strategie, kwaliteit, governance, technologie, processen,
    vaardigheden en datagedreven besluitvorming
  - Per vraag een score, toelichting en eventueel bewijs vastleggen
  - Voortgang per domein zien
  - Tussentijds opslaan en later verdergaan
  - De beoordeling afronden voor resultaatberekening
  key: Maturity beoordeling
- description: Resultaatweergave die scores per domein vertaalt naar inzichtelijke
    ontwikkelpunten en geprioriteerde vervolgstappen.
  goals:
  - Totale maturiteitsscore en domeinscores bekijken
  - Sterktes, gaps en concrete ontwikkelpunten begrijpen
  - Prioriteiten selecteren op impact en urgentie
  - Resultaten en actieoverzicht delen of exporteren
  - Terugkeren naar de beoordeling om antwoorden te verfijnen
  key: Scanresultaten en ontwikkelprioriteiten
project:
  description: Een data maturity scan waarmee organisaties hun datavolwassenheid gestructureerd
    beoordelen en uitkomsten vertalen naar ontwikkelpunten en prioriteiten.
  name: Pong data maturity scan versie 2
  projectId: 00e3fb56-8084-4b07-a9d4-49c6836403ad
  stack:
    backend: quarkus
    database: postgresql
    frontend: angular
  status: CREATED
roles:
- Gebruiker
- Beheerder
- system
