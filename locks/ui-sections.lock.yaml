- exists: true
  id: Maturity beoordeling
  outline:
    counts:
      buttons: 13
      cards: 0
      fields: 7
      formLabels: 7
      forms: 1
      headings: 3
      images: 0
      links: 0
      navLabels: 7
      sections: 2
    formLabels:
    - 0 — Niet beoordeeld / uitgesloten Geen maturiteitsscore De vraag kan niet worden
      beoordeeld of is aantoonbaar niet van toepassing op de organisatie.
    - 1 — Initieel / Ad hoc Datakwaliteit wordt incidenteel onderzocht, meestal pas
      wanneer problemen ontstaan.
    - 2 — Herhaalbaar Enkele teams voeren terugkerende controles uit, maar een organisatiebrede
      aanpak ontbreekt.
    - 3 — Gedefinieerd Voor kritieke datasets zijn kwaliteitsregels, verantwoordelijken
      en vaste controles vastgelegd.
    - 4 — Beheerst Kwaliteitsmetingen worden centraal gevolgd en afwijkingen leiden
      aantoonbaar tot verbeteracties.
    - 5 — Geoptimaliseerd Datakwaliteit wordt proactief, grotendeels geautomatiseerd
      en continu verbeterd.
    - Onderbouwing
    headings:
    - Maturity beoordeling
    - Voortgang
