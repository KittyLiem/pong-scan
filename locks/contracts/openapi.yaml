          enum: [Niet ingericht, Ad hoc, Herhaalbaar, Gedefinieerd, Beheerst, Optimaliserend]
    DomainScore:
      type: object
      required: [domainId, domainName, score, maturityLevel]
      properties:
        domainId:
          type: string
          format: uuid
