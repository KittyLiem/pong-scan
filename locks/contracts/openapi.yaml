          type: string
        score:
          type: number
          minimum: 0
          maximum: 5
        maturityLevel:
          $ref: '#/components/schemas/MaturityLevel'
    DevelopmentPoint:
      type: object
      required: [id, domainId, domainName, classification, text, recommendation]
      properties:
        id:
          type: string
          format: uuid
        domainId:
          type: string
          format: uuid
        domainName:
          type: string
        classification:
          type: string
          enum: [strength, development-point, gap]
        text:
          type: string
        recommendation:
          type: string
    PriorityItem:
      type: object
      required: [developmentPointId, impact, urgency, selected]
      properties:
        developmentPointId:
          type: string
          format: uuid
        impact:
          type: string
          enum: [high, medium, low]
        urgency:
          type: string
          enum: [high, medium, low]
        selected:
          type: boolean
    PrioritiesInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
