            $ref: '#/components/schemas/PriorityItem'
    ActionOverview:
      type: object
      required: [setRevision, items]
      properties:
        setRevision:
          type: integer
          minimum: 0
          description: 0 als er nog geen set is opgeslagen.
        items:
          type: array
          items:
            $ref: '#/components/schemas/PriorityItem'
    ScanResults:
      type: object
      required: [scanId, scanName, assessmentPeriod, completedAt, totalScore, maturityLevel, domainScores, developmentPoints, goals, priorities, availablePrioritySetRevisions]
      properties:
        scanId:
          type: string
          format: uuid
        scanName:
          type: string
        assessmentPeriod:
          type: string
        completedAt:
          type: string
          format: date-time
        totalScore:
          type: number
          minimum: 0
          maximum: 5
          description: Gemiddelde van alle beantwoorde vragen in de geselecteerde domeinen (2 decimalen).
        maturityLevel:
          $ref: '#/components/schemas/MaturityLevel'
        domainScores:
          type: array
