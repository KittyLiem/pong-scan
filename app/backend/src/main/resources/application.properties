# ---------------------------------------------------------------------------
# Productie (standaardprofiel): GEEN fallbacks voor credentials of geheimen.
# Vereist: APP_DB_URL, APP_DB_USERNAME, APP_DB_PASSWORD, ACCOUNT_TOKEN_SECRET (>= 32 tekens).
# ---------------------------------------------------------------------------
quarkus.http.port=8080
quarkus.http.limits.max-body-size=1M

quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${APP_DB_URL}
quarkus.datasource.username=${APP_DB_USERNAME}
quarkus.datasource.password=${APP_DB_PASSWORD}
quarkus.datasource.health.enabled=true

# Flyway scant bij de build beide locaties; welke daadwerkelijk worden toegepast bepaalt de runtime-instelling
# app.flyway.locations (env APP_FLYWAY_LOCATIONS of QUARKUS_FLYWAY_LOCATIONS). Standaard zonder demodata.
quarkus.flyway.locations=db/migration,db/demo
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.jdbc.statement-batch-size=50
app.flyway.locations=${APP_FLYWAY_LOCATIONS:${QUARKUS_FLYWAY_LOCATIONS:db/migration}}

account.token.secret=${ACCOUNT_TOKEN_SECRET}
account.token.issuer=pong-data-maturity-scan
account.token.audience=pong-data-maturity-scan-api
account.token.ttl=PT1H
account.login.max-failures=${ACCOUNT_LOGIN_MAX_FAILURES:5}
account.login.window=${ACCOUNT_LOGIN_WINDOW:PT15M}
scan.quota.max-per-organization=${SCAN_QUOTA_MAX_PER_ORGANIZATION:50}
scan.quota.max-per-day=${SCAN_QUOTA_MAX_PER_DAY:20}
# Optionele beheerder-bootstrap bij opstarten (beide nodig; wachtwoord min. 12 tekens). Bestaande gewone
# accounts worden nooit gepromoveerd.
account.bootstrap-admin.identifier=${ACCOUNT_BOOTSTRAP_ADMIN_IDENTIFIER:}
account.bootstrap-admin.password=${ACCOUNT_BOOTSTRAP_ADMIN_PASSWORD:}
# Alleen voor lokale docker-compose: staat bekende standaardwaarden en demodata toe in het prod-profiel.
app.allow-insecure-local-defaults=${APP_ALLOW_INSECURE_LOCAL_DEFAULTS:false}

# CORS staat uit: in productie serveert nginx frontend en API vanaf dezelfde origin.
# Optioneel aan te zetten met APP_CORS_ORIGINS (komma-gescheiden).
quarkus.http.cors.enabled=${APP_CORS_ENABLED:false}
quarkus.http.cors.origins=${APP_CORS_ORIGINS:}

quarkus.log.console.json.enabled=false
%prod.quarkus.log.console.json.enabled=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) [cid=%X{correlationId}] %s%e%n

quarkus.otel.sdk.disabled=${APP_OTEL_DISABLED:true}

# ---------------------------------------------------------------------------
# Ontwikkeling
# ---------------------------------------------------------------------------
%dev.quarkus.datasource.jdbc.url=${APP_DB_URL:jdbc:postgresql://localhost:5432/app}
%dev.quarkus.datasource.username=${APP_DB_USERNAME:app}
%dev.quarkus.datasource.password=${APP_DB_PASSWORD:app}
%dev.quarkus.datasource.devservices.enabled=false
%dev.app.flyway.locations=db/migration,db/demo
%dev.app.allow-insecure-local-defaults=true
%dev.account.token.secret=dev-only-token-secret-that-is-at-least-32-characters-long
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:4200,http://127.0.0.1:4200

# ---------------------------------------------------------------------------
# Tests (H2 in PostgreSQL-modus)
# ---------------------------------------------------------------------------
%test.quarkus.hibernate-orm.statistics=true
%test.quarkus.smallrye-openapi.enabled=true
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:app;MODE=PostgreSQL;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.devservices.enabled=false
%test.app.flyway.locations=db/migration,db/demo
%test.app.allow-insecure-local-defaults=true
%test.account.token.secret=test-only-token-secret-that-is-long-enough-for-hmac

# Documentatie alleen in dev/test; health en metrics blijven beschikbaar.
%prod.quarkus.smallrye-openapi.enabled=false
%prod.quarkus.swagger-ui.enabled=false
