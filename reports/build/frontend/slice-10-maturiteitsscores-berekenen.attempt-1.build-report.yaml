summary: Added the guarded /scans/:scanId/results route and a structurally faithful
  result page driven exclusively by GET /v1/scans/{scanId}/results. The client uses
  the in-memory bearer token and parses problem-details errors. The page renders total
  and domain scores, grouped strengths/gaps/development points, saved organization
  goals, action-overview count, refinement navigation, and local priority selection
  controls. Navigation exposes Resultaten when a completed scan is available.
