decisions:
- choice: Kennisgebiedselectie is onderdeel van de Maturity-beoordeling; een lege
    selectie houdt de scan in conceptstatus.
  unspecifiedId: asm-014
- choice: Organisatiedoelen zijn optionele context; wanneer ze worden aangeleverd
    zijn naam en prioriteit verplicht.
  unspecifiedId: dec-016
- choice: Doelselectie en prioritering zijn stappen binnen de Maturity-beoordeling
    en gebruiken updateScan; er wordt geen afzonderlijke route toegevoegd.
  unspecifiedId: asm-012
- choice: Een wijziging na afronding maakt via createScan een nieuwe conceptscan tegen
    het actuele modelsnapshot; de afgeronde scan en resultaten blijven ongewijzigd
    bewaard.
  unspecifiedId: dec-005
