decisions:
- choice: Bedrijfstak is optioneel bij het aanmaken van een organisatie, omdat alleen
    name contractueel verplicht is; aangeleverde waarden worden wel duurzaam opgeslagen.
  unspecifiedId: asm-007
- choice: Trend- en benchmarkhistorie blijven buiten scope; iedere duurzaam opgeslagen
    scan blijft afzonderlijk opvraagbaar.
  unspecifiedId: asm-009
- choice: Kennisgebiedselectie is onderdeel van de Maturity-beoordeling; een lege
    selectie houdt de scan in conceptstatus.
  unspecifiedId: asm-014
- choice: Voortgang is het begrensde percentage volledig beantwoorde verplichte vragen
    (0 tot en met 100), duurzaam opgeslagen en bij lezen gevalideerd.
  unspecifiedId: dec-010
- choice: Bewijs ondersteunt beveiligde bestandsreferenties en HTTPS-links; binaire
    inhoud valt buiten de scanportfoliorespons.
  unspecifiedId: dec-011
- choice: Afronding vereist voor iedere verplichte vraag zowel een score als een niet-lege
    toelichting.
  unspecifiedId: dec-002
